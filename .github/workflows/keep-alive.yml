name: Keep backend awake

on:
  schedule:
    # Toutes les 14 minutes (le seuil d'endormissement de Render est de 15 min)
    - cron: "*/14 * * * *"
  workflow_dispatch: # permet aussi de le lancer manuellement depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping le backend
        run: curl -s -o /dev/null -w "%{http_code}" https://generateur-films-backend.onrender.com/